org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

gtnh.settings.blowdryerTag = 0.2.2

# No git-tag versioning: GTNHGradle (1.0.41+) uses modVersion as the project version instead.
gtnh.modules.gitVersion = false

modName = AzureLib
modId = azurelib
modGroup = mod.azure.azurelib
modVersion = 1.1.5
useModGroupForPublishing = true
autoUpdateBuildScript = false

modDescription = Java Minecraft mod using Bedrock models to create custom models and animations for items, blocks, entities.
packFormatNumber = 1

minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614
channel = stable
mappingsVersion = 12
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/
developmentEnvironmentUserName = Developer

enableModernJavaSyntax = false
enableGenericInjection = true

generateGradleTokenClass =
gradleTokenVersion = VERSION
replaceGradleTokenInFile =

apiPackage =

# Lives in src/main/resources/META-INF/ (was accesstransformer.cfg, renamed at build time before).
accessTransformersFile = azurelib_at.cfg

usesMixins = true
separateMixinSourceSet =
usesMixinDebug = true
mixinPlugin =
mixinsPackage = mixins
# AzureLibLoadingPlugin applies the real mixin list through IEarlyMixinLoader (azurelib.early.mixins.json + azurelib.mixins.json).
# mixins.azurelib.json is intentionally empty; it only exists so GTNH doesn't generate one.
coreModClass = coremod.AzureLibLoadingPlugin
containsMixinsAndOrCoreModOnly = false
forceEnableMixins = false

usesShadowedDependencies = false
minimizeShadowedDependencies = true
relocateShadowedDependencies = true

includeWellKnownRepositories = true
excludeWellKnownRepositories =

# GTNH's built-in publishing targets the GTNH Nexus, so it stays off.
# addon.gradle publishes to the AzureDoom maven instead (credentials: azurelibUsername / azurelibPassword).
usesMavenPublishing = false
azureMavenUrl = https\://maven.azuredoom.com/mods

# Left empty on purpose: CurseForge / Modrinth / Discord go through mod-publish-plugin in build.gradle.
modrinthProjectId =
modrinthRelations =
curseForgeProjectId =
curseForgeRelations =

# Keeps the old artifact name so existing dependents (azurelib-forge-1.7.10:<ver>:dev) keep resolving.
customArchiveBaseName = azurelib-forge-1.7.10

# Using the custom spotless setup in addon.gradle instead of the GTNH one.
disableSpotless = true
# GTNH's Checkstyle only enforces "no star imports"; not wanted here.
disableCheckstyle = true
