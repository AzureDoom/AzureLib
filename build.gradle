plugins {
    id 'idea'
    id 'maven-publish'
    id 'fabric-loom' version '1.17.20'
    id 'babric-loom-extension' version '1.17.4'
    id 'com.diffplug.spotless' version "8.8.0"
    id 'me.modmuss50.mod-publish-plugin' version "2.1.1"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

base {
    archivesName = "${mod_id}-stationapi-${minecraft_version}"
}

version = mod_version
group = maven_group

loom {
    accessWidenerPath = file('src/main/resources/azurelib.accesswidener')
}

repositories {
    maven { url = 'https://maven.glass-launcher.net/snapshots/' }
    maven { url = 'https://maven.glass-launcher.net/releases/' }
    maven { url = 'https://maven.glass-launcher.net/babric' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://jitpack.io/' }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.glasslauncher:biny:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"

    // StationAPI: item NBT (animated item identity) and networking.
    modImplementation "net.modificationstation:StationAPI:${stationapi_version}"
    modImplementation "maven.modrinth:MTea0HEh:reBNQY2O"

    implementation 'org.apache.logging.log4j:log4j-core:2.17.2'
    implementation 'org.slf4j:slf4j-api:1.8.0-beta4'
    implementation 'org.apache.logging.log4j:log4j-slf4j18-impl:2.17.1'

    // Model/animation JSON parsing. Bundled so AzureLib doesn't rely on another mod happening to ship Gson.
    implementation "com.google.code.gson:gson:${gson_version}"
    include "com.google.code.gson:gson:${gson_version}"

    // @Nullable / @Nonnull. Compile-time only.
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'org.jetbrains:annotations:23.0.0'
}

configurations.configureEach {
    exclude group: 'babric'
}

processResources {
    def replaceProperties = [
        version        : project.version,
        mod_id         : mod_id,
        mod_name       : mod_name,
        mod_authors    : mod_authors,
        mod_license    : mod_license,
        mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    from('LICENSE') {
        rename { "${it}_${base.archivesName.get()}" }
    }
    from('LICENSE_Geckolib') {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

def keyPropsFile = new File(rootProject.projectDir, "key.properties")
if (keyPropsFile.exists()) {
    publishMods {
        def releaseProp = new Properties()
        releaseProp.load(new FileInputStream(keyPropsFile))
        file = remapJar.archiveFile
        changelog = rootProject.file("changelog.md").text
        type = STABLE
        modLoaders.add("babric")
        displayName = file.map { it.asFile.name }

        modrinth {
            projectId = project.modrinth_id
            accessToken = releaseProp.getProperty('modrinthKey')
            minecraftVersions.add(project.minecraft_version)
            requires {
                slug = "stationapi"
            }
            environment = CLIENT_AND_SERVER
        }

        discord {
            webhookUrl = releaseProp.getProperty("discordKey")
            username = "Azurelib Update Bot"
            avatarUrl = "https://cdn.modrinth.com/data/7zlUOZvb/a722b12250c1f42c63dd269f2e4aeefd7611f8fd.png"

            content = changelog.map { text ->
                final String mcVersion = project.property("minecraft_version")

                final String header =
                        "# A new version of AzureLib has been released for Minecraft ${mcVersion}!\n\n"

                final String suffix =
                        "\n\n**Full changelog available on Modrinth below.**"

                if (header.length() + text.length() + suffix.length() <= 2000) {
                    return header + text + suffix
                }

                def result = new StringBuilder(header)

                for (String line : text.readLines()) {
                    if (result.length() + line.length() + 1 + suffix.length() > 2000) {
                        break
                    }

                    result.append(line).append("\n")
                }

                return result.toString().trim() + suffix
            }

            style {
                look = "MODERN"
                link = "BUTTON"
            }

            setPlatforms(
                    publishMods.platforms.modrinth
            )
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java

            pom {
                name = mod_name
                description = mod_description
                url = 'https://github.com/AzureDoom/AzureLib'

                licenses {
                    license {
                        name = mod_license
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
            }
        }
    }

    repositories {
        mavenLocal()
        if (project.hasProperty('azurelibUsername')) {
            maven {
                name = 'azurelib'
                url = uri(maven_url)
                credentials(PasswordCredentials)
                authentication {
                    basic(BasicAuthentication)
                }
            }
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

spotless {
    java {
        eclipse().configFile("$rootDir/eclipse-formatter.xml")
        endWithNewline()
        importOrder("", "java", group.toString(), "\\#")
        leadingTabsToSpaces(4)
        removeUnusedImports()
        trimTrailingWhitespace()
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn("spotlessApply")
}
