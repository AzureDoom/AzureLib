plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom-remap' version '1.18.4'
    id 'ploceus' version '1.18.1'
    id 'com.diffplug.spotless' version "8.8.0"
    id 'me.modmuss50.mod-publish-plugin' version "2.1.1"
}

base {
    archivesName = "${mod_id}-ornithe-${minecraft_version}"
}

version = mod_version
group = maven_group

loom {
    accessWidenerPath = file('src/main/resources/azurelib.accesswidener')
}

ploceus {
    setIntermediaryGeneration(2)
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"

    clientExceptions ploceus.raven(project.client_raven_build, 'client')
    serverExceptions ploceus.raven(project.server_raven_build, 'server')
    clientSignatures ploceus.sparrow(project.client_sparrow_build, 'client')
    serverSignatures ploceus.sparrow(project.server_sparrow_build, 'server')
    clientNests ploceus.nests(project.client_nests_build, 'client')
    serverNests ploceus.nests(project.server_nests_build, 'server')
    mappings ploceus.featherMappings(project.feather_build)

    ploceus.dependOsl(project.osl_version)

    // Model/animation JSON parsing. Beta doesn't ship Gson, so it is bundled.
    implementation "com.google.code.gson:gson:${gson_version}"
    include "com.google.code.gson:gson:${gson_version}"

    // @Nullable / @Nonnull. Compile-time only.
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly 'org.jetbrains:annotations:23.0.0'
}

processResources {
    def replaceProperties = [
        version        : project.version,
        mod_id         : mod_id,
        mod_name       : mod_name,
        mod_authors    : mod_authors,
        mod_license    : mod_license,
        mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 8
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${base.archivesName.get()}" }
    }
    from('LICENSE_Geckolib') {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

def keyPropsFile = new File(rootProject.projectDir, "key.properties")
if (keyPropsFile.exists()) {
    publishMods {
        def releaseProp = new Properties()
        releaseProp.load(new FileInputStream(keyPropsFile))
        file = remapJar.archiveFile
        changelog = rootProject.file("changelog.md").text
        type = STABLE
        modLoaders.add("ornithe")
        displayName = file.map { it.asFile.name }

        modrinth {
            projectId = project.modrinth_id
            accessToken = releaseProp.getProperty('modrinthKey')
            minecraftVersions.add(project.minecraft_version)
            requires {
                slug = "osl"
            }
            environment = CLIENT_AND_SERVER
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java

            pom {
                name = mod_name
                description = mod_description
                url = 'https://github.com/AzureDoom/AzureLib'

                licenses {
                    license {
                        name = mod_license
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
            }
        }
    }

    repositories {
        mavenLocal()
        if (project.hasProperty('azurelibUsername')) {
            maven {
                name = 'azurelib'
                url = uri(maven_url)
                credentials(PasswordCredentials)
                authentication {
                    basic(BasicAuthentication)
                }
            }
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

spotless {
    java {
        eclipse().configFile("$rootDir/eclipse-formatter.xml")
        endWithNewline()
        importOrder("", "java", group.toString(), "\\#")
        leadingTabsToSpaces(4)
        removeUnusedImports()
        trimTrailingWhitespace()
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn("spotlessApply")
}
