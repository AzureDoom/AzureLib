plugins {
    id 'com.gtnewhorizons.gtnhconvention'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

tasks.matching { it.name == 'publishCurseforge' || it.name == 'publishModrinth' }.configureEach {
    dependsOn tasks.named('build')
}

def keyPropsFile = rootProject.file('key.properties')
if (keyPropsFile.exists()) {
    def releaseProp = new Properties()
    keyPropsFile.withInputStream { releaseProp.load(it) }

    def modrinthKey = releaseProp.getProperty('modrinthKey')?.trim()
    def discordKey = releaseProp.getProperty('discordKey')?.trim()

    publishMods {
        // reobfJar is the release jar under RFG; the plain `jar` task is the -dev jar.
        file = tasks.named('reobfJar').flatMap { it.archiveFile }
        changelog = rootProject.file('changelog.md').text
        type = STABLE
        modLoaders.add('forge')
        displayName = file.map { it.asFile.name }

        curseforge {
            projectId = '817423'
            projectSlug = 'azurelib'
            accessToken = releaseProp.getProperty('curseKey')
            minecraftVersions.add(project.minecraftVersion)
            client = true
            server = true
        }

        if (modrinthKey) {
            modrinth {
                projectId = '7zlUOZvb'
                accessToken = modrinthKey
                minecraftVersions.add(project.minecraftVersion)
                environment = CLIENT_AND_SERVER
            }
        }

        if (discordKey) {
            discord {
                webhookUrl = discordKey
                username = 'Azurelib Update Bot'
                avatarUrl = 'https://cdn.modrinth.com/data/7zlUOZvb/a722b12250c1f42c63dd269f2e4aeefd7611f8fd.png'

                content = changelog.map { text ->
                    final String mcVersion = project.property('minecraftVersion')

                    final String header =
                            "# A new version of AzureLib has been released for Minecraft ${mcVersion}!\n\n"

                    final String suffix =
                            "\n\n**Full changelog available on CurseForge and Modrinth below.**"

                    if (header.length() + text.length() + suffix.length() <= 2000) {
                        return header + text + suffix
                    }

                    def result = new StringBuilder(header)

                    for (String line : text.readLines()) {
                        if (result.length() + line.length() + 1 + suffix.length() > 2000) {
                            break
                        }

                        result.append(line).append('\n')
                    }

                    return result.toString().trim() + suffix
                }

                style {
                    look = 'MODERN'
                    link = 'BUTTON'
                }

                def platformsToLink = [publishMods.platforms.curseforge]
                if (modrinthKey) {
                    platformsToLink << publishMods.platforms.modrinth
                }
                setPlatforms(*platformsToLink)
            }
        }
    }
} else {
    logger.info('key.properties not found; CurseForge/Modrinth/Discord publishing is not configured.')
}
