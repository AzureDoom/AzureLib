buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
    }
    dependencies {
        classpath 'com.anatawa12.forge:ForgeGradle:1.2-1.1.1'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'com.diffplug.spotless' version '5.17.1'
}

apply plugin: 'forge'


version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-forge-${mc_version}"
}

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

minecraft {
    version = "${mc_version}-${forge_version}"
    runDir = 'run'
    mappings = "${mappings_channel}_${mappings_version}"

    if (file('src/main/resources/META-INF/accesstransformer.cfg').exists()) {
        accessTransformer file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://jitpack.io' }

    maven {
        name = 'Cursemaven'
        url = 'https://www.cursemaven.com/'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    implementation(
            "com.github.LegacyModdingMC.UniMixins:unimixins-all-1.7.10:${unimixins_version}:dev"
    ) {
        transitive = false
    }

    annotationProcessor(
            "com.github.LegacyModdingMC.UniMixins:unimixins-all-1.7.10:${unimixins_version}:dev"
    ) {
        transitive = false
    }
}

def mixinSrg = file("${buildDir}/tmp/compileJava/${mod_id}.mixins.srg")
def mixinRefmap = file("${buildDir}/tmp/compileJava/${mod_id}.refmap.json")

spotless {
    java {
        eclipse('4.13.0').configFile("$rootDir/eclipse-formatter.xml")
        endWithNewline()
        importOrder('', 'java', 'mod.azure.azurelib', '\\#')
        indentWithSpaces(4)
        removeUnusedImports()
        trimTrailingWhitespace()
    }
}

compileJava {
    dependsOn 'genSrgs'
    dependsOn 'spotlessApply'

    outputs.file mixinSrg
    outputs.file mixinRefmap

    doFirst {
        mixinSrg.parentFile.mkdirs()
        mixinSrg.text = ''

        options.compilerArgs += [
                "-AreobfSrgFile=${tasks.reobf.srg}",
                "-AoutSrgFile=${mixinSrg}",
                "-AoutRefMapFile=${mixinRefmap}",
                '-AdefaultObfuscationEnv=searge'
        ]
    }
}

reobf {
    addExtraSrgFile mixinSrg
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.register('sourcesJar', Jar) {
    archiveClassifier.set('sources')
    from sourceSets.main.allSource
}

processResources {
    def replaceProperties = [
            mc_version: mc_version,
            forge_version: forge_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            pack_format_number: pack_format_number,
            version: project.version,
            mcversion: mc_version
    ]

    inputs.properties replaceProperties

    filesMatching(['mcmod.info', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    filesMatching('META-INF/accesstransformer.cfg') {
        name = "${mod_id}_at.cfg"
    }
}

jar {
    dependsOn compileJava

    from mixinRefmap
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
                'ForceLoadAsMod': 'true',
                'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
                'TweakOrder': '0',
                'MixinConfigs': "${mod_id}.mixins.json",
                'FMLAT': "${mod_id}_at.cfg",
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': mod_authors
        )
    }
}

tasks.matching {
    it.name == 'runClient' || it.name == 'runServer'
}.all {
    args '--tweakClass', 'org.spongepowered.asm.launch.MixinTweaker'

    systemProperty 'mixin.env.remapRefMap', 'true'

    doFirst {
        systemProperty(
                'mixin.env.refMapRemappingFile',
                tasks.genSrgs.srgToMcp.absolutePath
        )
    }
}

tasks.register('devJar', Jar) {
    dependsOn compileJava
    archiveClassifier.set('dev')
    from sourceSets.main.output
    from mixinRefmap
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest.from(jar.manifest)
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishing {
    repositories {
        maven {
            name = mod_id
            url = uri(maven_url)

            credentials(PasswordCredentials)

            authentication {
                basic(BasicAuthentication)
            }
        }
    }

    publications {
        register('maven', MavenPublication) {
            groupId = project.group.toString()
            artifactId = base.archivesName.get()
            version = project.version.toString()

            artifact tasks.jar
            artifact tasks.devJar
            artifact tasks.sourcesJar

            pom {
                name = mod_name
                description = mod_description
                url = 'https://github.com/AzureDoom/AzureLib'

                licenses {
                    license {
                        name = mod_license
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
            }
        }
    }
}

tasks.withType(PublishToMavenRepository) {
    dependsOn reobf
}

tasks.withType(PublishToMavenLocal) {
    dependsOn reobf
}